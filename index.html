<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A1D23">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NeoBalance">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeoBalance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
/* Paleta SOM. Oscuro = referencia. Claro = inversión de roles. Botones naranja con texto oscuro. */
:root{
  /* claro (invertido) */
  --bg:#F5F5F5; --surface:#F5F5F5; --ink:#1A1D23; --muted:#50555C; --line:#BFC3C8; --data:#50555C;
  --accent:#FF6600; --num:#1A1D23; --btn-bg:#FF6600; --btn-ink:#1A1D23; --contrast:#1A1D23;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1D23; --surface:#1A1D23; --ink:#F5F5F5; --muted:#BFC3C8; --line:#50555C; --data:#AEB4BA;
    --num:#FF6600; --btn-bg:#FF6600; --btn-ink:#1A1D23; --contrast:#F5F5F5;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1D23; --surface:#1A1D23; --ink:#F5F5F5; --muted:#BFC3C8; --line:#50555C; --data:#AEB4BA;
  --num:#FF6600; --btn-bg:#FF6600; --btn-ink:#1A1D23; --contrast:#F5F5F5;
}

/* Elección manual del usuario: atributo propio, con más especificidad que el tema del visor */
html:root[data-app-theme="light"]{--c1:#FF6600;--c2:#1A1D23;--c3:#FFB380;--c4:#7A8088;--c5:#A84300;--c6:#BFC3C8;--c7:#4A4F56;--bg:#F5F5F5; --surface:#F5F5F5; --ink:#1A1D23; --muted:#50555C; --line:#BFC3C8; --data:#50555C; --num:#1A1D23; --contrast:#1A1D23; color-scheme:light}
html:root[data-app-theme="dark"]{--c1:#FF6600;--c2:#F5F5F5;--c3:#C24E00;--c4:#9AA1A8;--c5:#FFB380;--c6:#3A3F46;--c7:#6E747B;--bg:#1A1D23; --surface:#1A1D23; --ink:#F5F5F5; --muted:#BFC3C8; --line:#50555C; --data:#AEB4BA; --num:#FF6600; --contrast:#F5F5F5; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:22px 18px 110px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:28px 0 12px}
p{margin:0}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.greet{color:var(--muted);margin-bottom:6px}
.today-num{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,17vw,5.2rem);line-height:1;letter-spacing:-.03em;margin:4px 0 8px;color:var(--num)}
.period{font-size:1.02rem}
.period strong{font-weight:700}
.runway{display:flex;gap:3px;margin:18px 0 6px;flex-wrap:wrap}
.runway span{flex:1 1 6px;min-width:6px;height:10px;border-radius:2px;background:var(--line)}
.runway span.now{background:var(--accent)}
.runway-label{font-size:.88rem;color:var(--muted)}
.howbtn{background:none;border:0;padding:0;margin-top:14px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.breakdown{margin-top:10px;border-left:1px solid var(--line);padding:4px 0 4px 14px}
.breakdown div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.breakdown .total{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:700}

.nudge{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:22px}
.nudge.warn,.nudge.away,.nudge.extra{border:3px solid var(--accent)}
.nudge.warn p,.nudge.away h2,.nudge.extra p{font-weight:700}
.nudge p{margin-bottom:12px}
.nudge p:last-child{margin-bottom:0}
.row{display:flex;gap:8px;flex-wrap:wrap}

.log{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:24px}
.quick{display:flex;gap:8px;margin:10px 0}
.quick button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:transparent}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;flex:1}
.field label{font-size:.88rem;color:var(--muted)}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);background:transparent;min-width:0;border-radius:10px}
.field select option{background:var(--bg);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.btn{padding:10px 16px;border:1px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-ink);font-weight:700;border-radius:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.small{padding:7px 12px;font-size:.9rem}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .meta,.meta{font-size:.86rem;color:var(--muted)}
.list .amt{font-weight:600;white-space:nowrap}
.empty{padding:14px 0;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;padding:13px 2px 11px;color:var(--muted);border-top:2px solid transparent;font-size:.85rem}
nav button[aria-current="page"]{color:var(--ink);font-weight:600;border-top-color:var(--accent)}
textarea{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;font:.82rem/1.4 ui-monospace,monospace;color:var(--ink)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:0 8px;border:2px solid var(--accent);border-radius:999px;color:var(--ink);margin-left:6px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.compare div{border:1px solid var(--line);border-radius:12px;padding:12px}
.compare .best{border:3px solid var(--accent)}
.compare strong{display:block;font-family:var(--display);font-size:1.1rem}
.away li{align-items:flex-start}
select.inline{padding:8px;border:1px solid var(--line);border-radius:10px;background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bar{height:8px;border-radius:4px;background:var(--contrast);margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.list li.over{border-left:5px solid var(--accent);padding-left:12px}
.list li.over .meta{font-weight:700;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.seg button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1A1D23;font-weight:700}
details.faq{border-bottom:1px solid var(--line);padding:10px 0}
details.faq summary{cursor:pointer;font-weight:700;list-style-position:outside}
details.faq summary::marker{color:var(--accent)}
details.faq p{margin-top:6px;color:var(--muted)}

:root{--c1:#FF6600;--c2:#1A1D23;--c3:#FFB380;--c4:#7A8088;--c5:#A84300;--c6:#BFC3C8;--c7:#4A4F56;}
@media (prefers-color-scheme:dark){:root:not([data-app-theme="light"]){--c1:#FF6600;--c2:#F5F5F5;--c3:#C24E00;--c4:#9AA1A8;--c5:#FFB380;--c6:#3A3F46;--c7:#6E747B;}}
.donut{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-top:8px}
@media (max-width:360px){.donut{grid-template-columns:1fr}}
.donut svg{width:150px;height:150px;display:block}
.donut circle.seg2{cursor:default}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:baseline;padding:4px 0;font-size:.92rem}
.legend .sw{width:12px;height:12px;border-radius:3px;align-self:center}
.legend .pc{font-weight:700;text-align:right;white-space:nowrap}
.legend .am{grid-column:2 / 4;font-size:.84rem;color:var(--muted);margin-top:-4px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav button{border:1px solid var(--line);background:transparent;border-radius:10px;width:40px;height:40px;font-size:1.2rem}
.mnav button:disabled{opacity:.3;cursor:default}
.wordmark{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;margin:-4px 0 18px;color:var(--ink)}
.wordmark span{color:var(--accent)}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Secciones"><div id="nav"></div></nav>
<script>

    minPaid:"Minimum paid",
    settingsTitle:"Settings",balance:"Current account balance",balanceHint:"Copy it from your banking app whenever you like. Everything is calculated from it.",

    editSpend:"Edit spend",date:"Date",
    subsHint:"Streaming, music, apps, gym… the small things that repeat. Here you see what they really add up to and decide what to cut.",
    subsMonth:"Per month",subsYear:"Per year",subsCount:n=>`${n} ${n===1?"subscription":"subscriptions"}`,
    addSub:"Add subscription",trialEnd:"Free trial ends (optional)",trialTag:d=>`trial until ${d}`,
    cancelled:"Cancelled",cancelSaved:x=>`Subscription cancelled. You save ${x} a year.`,
    noSubs:"Add your subscriptions: streaming, music, apps, cloud storage, gym…",monthlyEq:x=>`${x} a month`,
    trialNudge:(n,d,a)=>`The free trial of “${n}” ends on ${d}. After that you'll be charged ${a}. Keep it?`,keepSub:"Keep it",cancelSub:"Cancel it",

/* ======================= UTILIDADES ======================= */
const pad=n=>String(n).padStart(2,"0");
const toStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12);};
const todayStr=()=>toStr(new Date());
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return toStr(d);};
const addMonths=(s,n)=>{const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1+n,1,12);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return toStr(t);};
const daysBetween=(a,b)=>Math.round((toDate(b)-toDate(a))/86400000);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let V,T,money,niceDate,monthYear;
function setLang(){
  const L=LANGS[S.lang]||LANGS.es, C=CURRENCIES[S.currency]||CURRENCIES.EUR;
  T=makeT(S.lang in LANGS?S.lang:"es");
  V={locale:L.locale,sym:C.sym,quick:[5,10,20,50]};
  document.documentElement.lang=S.lang;
  money=n=>new Intl.NumberFormat(L.locale,{style:"currency",currency:S.currency}).format(n);
  niceDate=s=>toDate(s).toLocaleDateString(L.locale,{day:"numeric",month:"long"});
  monthYear=s=>toDate(s).toLocaleDateString(L.locale,{month:"long",year:"numeric"});
}
const catName=k=>(T.cats[k]||k);
function nextIncomeDate(i){
  if(i.freq==="monthly") return addMonths(i.next,1);
  if(i.freq==="biweekly") return addDays(i.next,14);
  if(i.freq==="weekly") return addDays(i.next,7);
  if(i.freq==="semimonthly"){ const d=toDate(i.next); return d.getDate()<15 ? toStr(new Date(d.getFullYear(),d.getMonth(),15,12)) : toStr(new Date(d.getFullYear(),d.getMonth()+1,1,12)); }
  return null;
}

function seedHistory(x){
  let r=7; const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  const t=todayStr(), w=[.42,.16,.12,.18,.05,.07];
  const inc=x.incomes.find(i=>i.isPay)||x.incomes.find(i=>i.freq!=="once"), payAmt=inc?inc.amount:1400, fixed=x.bills.filter(b=>b.freq===1).reduce((s,b)=>s+b.amount,0)+x.debts.reduce((s,d)=>s+d.min,0);
  for(let m=5;m>=0;m--){
    const base=addMonths(t,-m).slice(0,8)+"01"; const dim=new Date(toDate(base).getFullYear(),toDate(base).getMonth()+1,0).getDate();
    const lastDay=m===0?toDate(t).getDate():dim;
    x.tx.push({type:"income",amount:payAmt,name:inc?inc.name:"",date:base.slice(0,8)+pad(Math.min(3,lastDay))});
    x.tx.push({type:"bill",amount:fixed,name:"",date:base.slice(0,8)+pad(Math.min(5,lastDay))});
    for(let d=1;d<=lastDay;d++){ if(rnd()<.55){ let u=rnd(),c=0,acc=0; for(;c<w.length-1;c++){acc+=w[c]; if(u<acc)break;}
      x.spends.push({id:uid(),amount:Math.round((4+rnd()*38)*(c===0?1.1:1)*100)/100,cat:CAT_KEYS[c],note:"",date:base.slice(0,8)+pad(d)}); } }
  }
  x.spends.sort((a,b)=>b.date.localeCompare(a.date)); x.limits={leisure:120,food:300}; txIds(x); return x;
}

function payIncome(){return S.incomes.find(i=>i.isPay&&i.freq!=="once");}
function nextPayday(){const p=payIncome(); return p?p.next:addDays(todayStr(),30);}
function reserveAt(b,date){const mu=daysBetween(date,b.next)/30.44;return b.amount*Math.min(1,Math.max(0,1-mu/b.freq));}
const isProrated=b=>b.prorate&&b.freq>=2;
const resAcc=b=>{ if(!isProrated(b)||!b.reserveAcc) return null; const a=S.accounts.find(x=>x.id===b.reserveAcc); return a&&!a.spend?a:null; };
const isVirtual=b=>isProrated(b)&&!resAcc(b);
const heldIn=(accId,date)=>S.bills.filter(b=>resAcc(b)&&resAcc(b).id===accId).reduce((s,b)=>s+reserveAt(b,date),0);
const virtualReserve=date=>S.bills.filter(isVirtual).reduce((s,b)=>s+reserveAt(b,date),0);
function calc(){
  const today=todayStr(), pay=nextPayday(), raw=daysBetween(today,pay), days=Math.max(1,raw);
  const pb=S.bills.filter(b=>!isProrated(b)&&b.next<=pay), pd=S.debts.filter(d=>d.balance>0&&d.next<=pay);
  const pending=pb.reduce((s,b)=>s+b.amount,0)+pd.reduce((s,d)=>s+Math.min(d.min,d.balance),0);
  const reserve=virtualReserve(pay);
  const available=spendable()-pending-reserve-S.cushion-S.aside;
  return {pay,days,overdue:raw<0,pending,pendingCount:pb.length+pd.length,reserve,available,perDay:available/days};
}
function simulate(strategy){
  let ds=S.debts.filter(d=>d.balance>0).map(d=>({...d}));
  if(!ds.length) return null;
  const budget=ds.reduce((s,d)=>s+d.min,0)+(S.debtExtra||0);
  let months=0, interest=0;
  while(ds.some(d=>d.balance>0.005)){
    months++; if(months>600) return {never:true};
    ds.forEach(d=>{ if(d.balance>0){const i=d.balance*d.rate/1200; d.balance+=i; interest+=i;} });
    let left=budget;
    ds.forEach(d=>{ if(d.balance>0){const p=Math.min(d.min,d.balance); d.balance-=p; left-=p;} });
    const order=ds.filter(d=>d.balance>0).sort(strategy==="snowball"?(a,b)=>a.balance-b.balance:(a,b)=>b.rate-a.rate);
    for(const d of order){ if(left<=0) break; const p=Math.min(left,d.balance); d.balance-=p; left-=p; }
  }
  return {months,interest};
}

function undoTx(id){const t=S.tx.find(x=>x.id===id); if(!t) return;

/* ---------- Mes ---------- */
const ym=s=>s.slice(0,7);
function periodStats(pred){
  const sp=S.spends.filter(x=>pred(x.date)), tx=S.tx.filter(x=>pred(x.date));
  const income=tx.filter(t=>t.type==="income").reduce((a,t)=>a+t.amount,0);
  const subs=tx.filter(t=>t.type==="bill"&&t.sub).reduce((a,t)=>a+t.amount,0);
  const fixed=tx.filter(t=>t.type!=="income").reduce((a,t)=>a+t.amount,0);
  const variable=sp.reduce((a,x)=>a+x.amount,0);
  const byCat={}; sp.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.amount);
  return {income,subs,fixed,fixedNoSub:fixed-subs,variable,out:fixed+variable,saved:income-fixed-variable,byCat,n:sp.length+tx.length};
}
function monthStats(key){ return periodStats(d=>d.slice(0,7)===key); }
function firstDataDate(){ const all=[...S.spends.map(x=>x.date),...S.tx.map(x=>x.date)].sort(); return all[0]||todayStr(); }
function monthForecast(){
  const t=todayStr(), d=toDate(t), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(), day=d.getDate();
  const eom=toStr(new Date(d.getFullYear(),d.getMonth(),dim,12)), left=dim-day;
  const cur=monthStats(ym(t));
  let pace=cur.variable/Math.max(1,day);
  if(day<5){ const prev=monthStats(ym(addMonths(t,-1))); if(prev.variable>0) pace=prev.variable/30.44; }
  const bills=S.bills.filter(b=>!isProrated(b)&&b.next<=eom).reduce((s,b)=>s+b.amount,0);
  const debts=S.debts.filter(x=>x.balance>0&&x.next<=eom).reduce((s,x)=>s+Math.min(x.min,x.balance),0);
  let inc=0; S.incomes.forEach(i=>{ let n=i.next; let g=0; while(n&&n<=eom&&g<10){ inc+=i.amount; if(i.freq==="once")break; n=nextIncomeDate({...i,next:n}); g++; } });
  return spendable()-bills-debts+inc-pace*left;
}
function insights(key){
  const out=[], cur=monthStats(key), t=toDate(todayStr());
  const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(), frac=Math.max(t.getDate(),1)/dim;
  const prevKeys=[1,2,3].map(n=>ym(addMonths(todayStr(),-n))), prev=prevKeys.map(monthStats).filter(m=>m.variable>0);
  if(prev.length>=2 && t.getDate()>=7){
    Object.keys(cur.byCat).filter(c=>c!=="unlogged").forEach(c=>{
      const avg=prev.reduce((s,m)=>s+(m.byCat[c]||0),0)/prev.length; if(avg<15) return;
      const proj=cur.byCat[c]/frac, p=Math.round((proj/avg-1)*100);
      if(p>=30&&proj-avg>20) out.push(T.insMore(catName(c),p)); else if(p<=-30) out.push(T.insLess(catName(c),-p));
    });
  }
  Object.entries(S.limits).forEach(([c,l])=>{ const s=cur.byCat[c]||0; if(l>0&&s>l) out.unshift(T.insOver(catName(c),money(s-l))); });
  const pm=monthStats(ym(addMonths(todayStr(),-1)));
  if(cur.income>0&&pm.income>0) out.push(T.insRate(Math.round(cur.saved/cur.income*100),Math.round(pm.saved/pm.income*100)));
  if(cur.byCat.unlogged>0) out.push(T.insUnlogged(money(cur.byCat.unlogged)));
  if(monthForecast()<0) out.unshift(T.insNeg);
  return out.slice(0,3);
}
let mview="mes", moff=0, yoff=0;
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
function donutSVG(items,total,center,sub){
  const r=42, C=2*Math.PI*r, gap=items.length>1?1.2:0; let acc=0;
  const segs=items.map(it=>{const f=it.value/total, len=Math.max(0,f*C-gap);
    const el=`<circle class="seg2" cx="60" cy="60" r="${r}" fill="none" stroke="${it.color}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"><title>${esc(it.label)}: ${money(it.value)} (${pct(it.value,total)} %)</title></circle>`;
    acc+=f*C; return el;}).join("");
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${esc(sub)}: ${money(total)}">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="18" opacity=".35"/>${segs}
    <text x="60" y="58" text-anchor="middle" style="font:700 13px var(--display);fill:var(--ink)">${center}</text>
    <text x="60" y="74" text-anchor="middle" style="font:400 9.5px var(--body);fill:var(--muted)">${esc(sub)}</text></svg>`;
}
function donut(items,total,sub,base){   // base = total contra el que se calculan los %
  items=items.filter(i=>i.value>0.005).sort((a,b)=>b.value-a.value);
  if(!items.length) return "";
  const b=base||total;
  return `<div class="donut">${donutSVG(items,total,money(Math.round(b)).replace(/[.,]00(?=\D*$)/,""),sub)}
  <ul class="legend">${items.map(i=>`<li><span class="sw" style="background:${i.color}"></span><span>${esc(i.label)}</span><span class="pc">${pct(i.value,b)} %</span><span class="am">${money(i.value)}</span></li>`).join("")}</ul></div>`;
}
function destDonut(st){
  if(st.income<=0) return `<p class="empty">${T.destNone}</p>`;
  const items=[{label:T.destBills,value:st.fixedNoSub,color:"var(--c2)"},{label:T.destSubs,value:st.subs,color:"var(--c4)"},
    {label:T.destVar,value:st.variable,color:"var(--c3)"},{label:T.destSaved,value:Math.max(0,st.saved),color:"var(--c1)"}];
  const deficit=st.saved<0;

function viewMonth(){
  const t=todayStr(), first=firstDataDate(), key=ym(addMonths(t,-moff)), cur=moff===0, m=monthStats(key);
  const canPrev=key>ym(first);
  const monthName=toDate(key+"-01").toLocaleDateString(V.locale,{month:"long",year:"numeric"});
  const cats=CAT_KEYS.map(c=>{const s=m.byCat[c]||0, l=S.limits[c]||0, pc=l>0?Math.min(100,s/l*100):0, over=l>0&&s>l;
    if(!cur&&!s&&!l) return "";
    return `<li class="${over?"over":""}" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px"><span>${T.cats[c]}</span><span class="amt">${money(s)}</span></div>
    ${l>0?`<div class="bar"><i style="width:${pc}%"></i></div>
    <div class="meta">${over?T.over(money(s-l)):T.left(money(l-s))} · ${T.limit} ${money(l)}</div>`:(cur?`<div class="meta">${T.noLimit}</div>`:"")}
    ${cur?`<div class="field" style="margin:6px 0 0;max-width:160px"><label for="lim-${c}" class="sr">${T.limit} ${T.cats[c]}</label><input id="lim-${c}" data-limit="${c}" type="number" inputmode="decimal" min="0" step="1" value="${l||""}" placeholder="${T.limit}"></div>`:""}</li>`;}).join("");
  const rows=[5,4,3,2,1,0].map(n=>{const k=ym(addMonths(key+"-01",-n)); return {label:toDate(k+"-01").toLocaleDateString(V.locale,{month:"short"}),...monthStats(k)};});
  let head="";
  if(cur){ const f=monthForecast(); head=`<p class="period" style="margin-top:10px">${f>=0?T.forecast(money(f)):T.forecastNeg(money(-f))}</p><p class="muted" style="font-size:.88rem;margin-top:4px">${T.forecastNote}</p>`; }
  else head=`<p class="meta" style="margin-top:6px">${T.closed}</p>`;
  const ins=cur?insights(key):[];

function viewAno(){
  const t=todayStr(), cy=toDate(t).getFullYear(), y=cy-yoff, first=firstDataDate(), fy=toDate(first).getFullYear();
  const isCur=y===cy, md=t.slice(5);                       // en el año en curso: hasta hoy
  const inY=(d,yr)=>d.slice(0,4)===String(yr)&&(!isCur||d.slice(5)<=md);
  const st=periodStats(d=>inY(d,y)), prev=periodStats(d=>inY(d,y-1));
  const lastM=isCur?toDate(t).getMonth()+1:12, firstM=y===fy?toDate(first).getMonth():0;
  const rows=[...Array(lastM-firstM)].map((_,j)=>{const i=j+firstM;const k=`${y}-${pad(i+1)}`; return {label:toDate(k+"-01").toLocaleDateString(V.locale,{month:"short"}),...monthStats(k)};});
  const rateP=prev.income>0?Math.round(prev.saved/prev.income*100)+" %":"—";
  return `<div class="mnav"><button data-yoff="1" ${y>fy?"":"disabled"} aria-label="${T.prevM}">‹</button>
    <h1 style="font-size:1.6rem;text-align:center">${isCur?T.ytd(y):T.fullYear(y)}</h1>

  ${first.slice(0,4)===String(y)&&first.slice(5)>"01-01"?`<p class="meta" style="margin-top:6px">${T.dataSince(niceDate(first))}</p>`:""}
  ${summary(st)}

/* ======================= EVENTOS ======================= */
const num=id=>{const el=document.getElementById(id);return el?parseFloat(String(el.value).replace(",",".")):NaN;};
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
document.addEventListener("change",e=>{ if(e.target.dataset.hf!==undefined){hf[e.target.dataset.hf]=e.target.value; return render();} if(e.target.dataset.away) awayChoice[e.target.dataset.away]=e.target.value; if(e.target.id==="wRec"){S.weeklyRecon=e.target.checked; save();} });
document.addEventListener("click",e=>{
  const el=e.target.closest("button"); if(!el) return; const d=el.dataset;
  if(d.tab){tab=d.tab;paying=null;showAllRecv=false;showHow=false;showRecon=false;showCsv=false;showHelp=false;editing=null;confirmDel=null;render();window.scrollTo(0,0);return;}
  if(d.quick){const i=document.getElementById("sAmt");i.value=d.quick;i.focus();return;}
  if(d.delSpend) return removeSpend(d.delSpend);
  if(d.mview){mview=d.mview;return render();}
  if(d.moff){moff=Math.max(0,moff+Number(d.moff));return render();}
  if(d.yoff){yoff=Math.max(0,yoff+Number(d.yoff));return render();}
  if(d.gsub){gsub=d.gsub;paying=null;editing=null;confirmDel=null;showCsv=false;return render();}
  if(d.cancelsub){const b=S.bills.find(x=>x.id===d.cancelsub); if(b){flash=T.cancelSaved(money(b.amount/(b.freq||1)*12)); S.bills=S.bills.filter(x=>x.id!==b.id); save();} return render();}
  if(d.trialkeep){const b=S.bills.find(x=>x.id===d.trialkeep); if(b){delete b.trialEnd; save();} return render();}
  if(d.trialcancel){const b=S.bills.find(x=>x.id===d.trialcancel); if(b){flash=T.cancelSaved(money(b.amount/(b.freq||1)*12)); S.bills=S.bills.filter(x=>x.id!==b.id); save();} return render();}
  if(d.pay){paying=d.pay; render(); const pi=document.getElementById("payAmt"); if(pi){pi.focus(); pi.select();} return;}
  if(d.paydebt) return payDebtMin(d.paydebt);
  if(d.recv) return receiveIncome(d.recv);
  if(d.askDel){confirmDel=d.askDel.replace(":","");return render();}
  if(d.del&&d.del.startsWith("t:")){confirmDel=null; return undoTx(d.del.slice(2));}
  if(d.del){const [k,id]=d.del.split(":"); if(k==="s"){const sp=S.spends.find(x=>x.id===id); if(sp) adj(sp.amount,sp.acc); S.spends=S.spends.filter(x=>x.id!==id);}
    if(k==="b")S.bills=S.bills.filter(x=>x.id!==id); if(k==="d")S.debts=S.debts.filter(x=>x.id!==id); if(k==="i")S.incomes=S.incomes.filter(x=>x.id!==id);
    if(k==="a"&&S.accounts.length>1){S.accounts=S.accounts.filter(x=>x.id!==id); if(!S.accounts.some(a=>a.spend)) S.accounts[0].spend=true;}
    confirmDel=null; save(); return render();}
  if(d.edit){const [k,id]=d.edit.split(":"); editing={kind:k,id}; render(); window.scrollTo(0,0); return;}
  if(d.themeSet){S.theme=d.themeSet;save();return render();}
  if(d.lang){S.lang=d.lang;setLang();save();return render();}
  if(d.cur){S.currency=d.cur;setLang();save();return render();}
  switch(d.act){
    case "how": showHow=!showHow; return render();
    case "n-half": return resolveNudge(.5);
    case "n-all": return resolveNudge(1);
    case "n-keep": return resolveNudge(0);
    case "cancel-del": confirmDel=null; return render();
    case "cancel-edit": editing=null; return render();
    case "pay-cancel": paying=null; return render();
    case "pay-ok": {const a=num("payAmt"), id=paying; if(!(a>0)){flash=T.invalid;return render();} paying=null; payBill(id,true,a); flash=T.paidMsg; return render();}
    case "save-tx": {const a=num("tAmt"), dt=val("tDate"); if(!(a>0)||!dt){flash=T.invalid;return render();} editTx(editing.id,a,dt); editing=null; flash=T.savedMsg; return render();}
    case "recv-all": showAllRecv=!showAllRecv; return render();
    case "log": {const a=num("sAmt"); if(!(a>0)) return; return logSpend(a,val("sCat"),val("sNote"),val("sAcc"));}
    case "save-bill": {
      const n=val("bName"),a=num("bAmt"),f=Number(val("bFreq")),nx=val("bNext");
      if(!n||!(a>0)||!nx){flash=T.invalid;return render();}
      const pr=document.getElementById("bPro").checked&&f>=2;
      const item={name:n,amount:a,freq:f,next:nx,prorate:pr,reserveAcc:pr?val("bRes"):""};
      if(editing&&editing.kind==="b") Object.assign(S.bills.find(x=>x.id===editing.id),item); else S.bills.push({id:uid(),kind:"bill",...item});
      editing=null; save(); return render();
    }
    case "save-inc": {
      const n=val("iName"),a=num("iAmt"),f=val("iFreq"),nx=val("iNext");
      if(!n||!(a>0)||!nx){flash=T.invalid;return render();}
      const isPay=document.getElementById("iPay").checked&&f!=="once";
      const item={name:n,amount:a,freq:f,next:nx,isPay};
      if(isPay) S.incomes.forEach(x=>x.isPay=false);          // solo una nómina marca el periodo
      if(editing&&editing.kind==="i") Object.assign(S.incomes.find(x=>x.id===editing.id),item); else S.incomes.push({id:uid(),...item});
      editing=null; save(); return render();
    }
    case "save-debt": {
      const n=val("dName"),b=num("dBal"),r=num("dRate"),m=num("dMin"),nx=val("dNext");
      if(!n||!(b>=0)||!(r>=0)||!(m>0)||!nx){flash=T.invalid;return render();}
      const item={name:n,balance:b,rate:r,min:m,next:nx};
      if(editing&&editing.kind==="d") Object.assign(S.debts.find(x=>x.id===editing.id),item); else S.debts.push({id:uid(),...item});
      editing=null; save(); return render();
    }
    case "hist": tab="gastos"; gsub="dia"; editing=null; render(); window.scrollTo(0,0); return;
    case "recon-open": tab="hoy"; showRecon=true; S.away=null; render(); window.scrollTo(0,0); return;
    case "help": tab="ajustes"; showHelp=true; render(); window.scrollTo(0,0); return;
    case "help-back": showHelp=false; render(); window.scrollTo(0,0); return;
    case "recon-cancel": showRecon=false; return render();
    case "recon-later": S.reconSnooze=todayStr(); S.reconPrompt=null; save(); return render();
    case "recon-do": { const reg=document.getElementById("recU").checked; const r=doReconcile("rec-",reg); showRecon=false; save(); flash=reconMsg(r); return render(); }
    case "save-sub": {
      const n=val("uName"),a=num("uAmt"),f=Number(val("uFreq")),nx=val("uNext"),tr=val("uTrial");
      if(!n||!(a>0)||!nx){flash=T.invalid;return render();}
      const item={kind:"sub",name:n,amount:a,freq:f,next:nx,prorate:f>=2,trialEnd:tr||null,reserveAcc:f>=2?val("uRes"):""};
      if(editing&&editing.kind==="sub") Object.assign(S.bills.find(x=>x.id===editing.id),item); else S.bills.push({id:uid(),...item});
      editing=null; save(); return render();
    }
    case "csv": showCsv=!showCsv; return render();
    case "copy-csv": {const t=document.getElementById("csvTxt"); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{flash=T.copied;render();}).catch(()=>t.select()); return;}
    case "save-spend": {
      const sp=S.spends.find(x=>x.id===editing.id); const a=num("eAmt"), dt=val("eDate"); if(!sp||!(a>0)||!dt){flash=T.invalid;return render();}
      adj(sp.amount,sp.acc);                     // deshacer el gasto original
      sp.amount=a; sp.date=dt; sp.cat=val("eCat"); sp.note=val("eNote"); if(document.getElementById("eAcc")) sp.acc=val("eAcc");
      adj(-a,sp.acc);                            // aplicar el gasto corregido
      editing=null; save(); flash=T.savedMsg; return render();
    }
    case "add-acc": if(S.accounts.length<3){S.accounts.push({id:uid(),name:T.accN(S.accounts.length+1),balance:0,spend:false}); save();} return render();
    case "save-acc": {
      S.accounts.forEach(a=>{ const n=val("accN-"+a.id), b=num("accB-"+a.id); if(n) a.name=n; if(!isNaN(b)) a.balance=b; a.spend=document.getElementById("accS-"+a.id).checked; });
      if(!S.accounts.some(a=>a.spend)) S.accounts[0].spend=true;
      S.demo=false; save(); flash=T.savedMsg; return render();
    }
    case "save-limits": { document.querySelectorAll("[data-limit]").forEach(inp=>{ const v=parseFloat(inp.value); if(v>0) S.limits[inp.dataset.limit]=v; else delete S.limits[inp.dataset.limit]; }); save(); flash=T.savedMsg; return render(); }
    case "save-extra": {const x=num("dExtra"); if(x>=0){S.debtExtra=x;save();} return render();}
    case "extra-pay": {const a=num("xAmt"), id=val("xDebt"), dd=S.debts.find(x=>x.id===id); if(!dd||!(a>0)) return;
      const p=Math.min(a,dd.balance), splits=[]; dd.balance-=p; mover(splits)(-p); pushTx({type:"debt",amount:p,name:dd.name,date:todayStr(),ref:dd.id,splits,balDelta:p}); save(); flash=T.savedMsg; return render();}
    case "away-done": {
      const a=S.away;
      a.bills.forEach(id=>{ (awayChoice["b:"+id]??"yes")==="yes" ? payBill(id,true) : skipBill(id); });
      a.debts.forEach(id=>{ if((awayChoice["d:"+id]??"yes")==="yes") payDebtMin(id,true); else {const x=S.debts.find(z=>z.id===id); if(x) x.next=addMonths(x.next,1);} });
      a.inc.forEach(id=>{ (awayChoice["i:"+id]??"yes")==="yes" ? receiveIncome(id,true) : skipIncome(id); });
      const r=doReconcile("awBal-",true);   // el saldo real manda; la diferencia queda registrada
      S.away=null; awayChoice={}; save(); flash=reconMsg(r); return render();
    }
    case "away-fresh": {
      const t=todayStr();
      S.bills.forEach(x=>{ while(x.freq>0&&x.next<t) x.next=addMonths(x.next,x.freq); }); S.bills=S.bills.filter(x=>!(x.freq===0&&x.next<t));
      S.debts.forEach(x=>{ while(x.next<t) x.next=addMonths(x.next,1); });
      S.incomes.forEach(x=>{ while(x.freq!=="once"&&x.next<t) x.next=nextIncomeDate(x); });
      doReconcile("awBal-",false); S.away=null; save(); return render();}
    case "away-dismiss": S.away=null; save(); return render();
    case "save-set": {const c=num("aCush"),s=num("aAside"); if(c>=0)S.cushion=c; if(s>=0)S.aside=s; S.demo=false; save(); flash=T.savedMsg; return render();}
    case "copy": {const t=document.getElementById("bk"); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{flash=T.copied;render();}).catch(()=>t.select()); return;}
    case "restore": {try{const x=JSON.parse(document.getElementById("bk").value); if(!x||!x.v||!Array.isArray(x.bills)) throw 0; S=normalize(x); setLang(); save(); flash=T.restored;}catch(err){flash=T.badData;} return render();}
    case "example": S=seedHistory(exampleState(S.lang,S.currency)); save(); tab="hoy"; return render();
    case "ask-empty": confirmDel="all"; return render();
    case "empty": S={...exampleState(S.lang,S.currency),demo:false,accounts:[{id:uid(),name:T.defAcc,balance:0,spend:true}],cushion:0,debtExtra:0,incomes:[],bills:[],debts:[],spends:[],tx:[],limits:{}}; confirmDel=null; save(); tab="ajustes"; return render();
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="sAmt") document.querySelector('[data-act="log"]').click(); if(e.key==="Enter"&&e.target.id==="payAmt") document.querySelector('[data-act="pay-ok"]').click(); });
render();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
